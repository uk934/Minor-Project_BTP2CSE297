<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zero-G Grocery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }
        .auth-card h2 { margin-bottom: 20px; }
        .flash-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    
    <div class="auth-container">
        <div class="auth-card glass-panel">
            <h2>Welcome Back</h2>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="flash-msg">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            
            <form method="POST" action="/login">
                <div class="form-group" style="text-align: left;">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn primary-btn btn-block" style="margin-top: 15px;">Login</button>
            </form>
            
            <div style="margin-top: 20px; font-size: 0.9rem;">
                Don't have an account? <a href="/register" style="color: var(--accent-color); font-weight: bold; text-decoration: none;">Sign Up</a>
            </div>
            
            <div style="margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">
                Test Account: <b>test_user</b> / <b>password123</b>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
